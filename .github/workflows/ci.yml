# Build, test and audit on every push.
#
# Runs on macos-26 rather than macos-latest: this project needs the macOS 26
# (Tahoe) SDK, and macos-latest still points at macOS 15. Same reason as
# LaunchpadX, see osx-launchpad/docs/update-ops.md.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: swift build

      # The runner has no chat.db and no TCC grant. Every test that would need
      # either skips itself, so this must stay green on a bare machine.
      - name: Test
        run: swift test

      # The hard security rule from CLAUDE.md, enforced mechanically. See the
      # script for why entitlements cannot do this job.
      - name: Audit for network and telemetry code
        run: scripts/check-no-network.sh

      # Ad-hoc is acceptable here: TCC identity only matters on a real user's
      # machine, and this step exists to prove the bundle assembles and the
      # binary carries no networking symbols.
      - name: Assemble app bundle
        run: OTP_ALLOW_ADHOC=1 scripts/build-signed-app.sh

      - name: Audit the built binary
        run: scripts/check-no-network.sh
